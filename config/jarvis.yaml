# ============================================================
# JARVIS main config (non-secret). Secrets live in .env only.
# Every component reads host/port/paths from here so the whole
# system can run on two nodes or collapsed onto one machine.
# ============================================================

hub:
  # 127.0.0.1 = the Mini only (safest). The Telegram bot runs INSIDE this
  # process and dials out to Telegram, so it works from your phone with NO
  # open ports and this on loopback. Only change this if you want to reach
  # the web dashboard from OTHER devices:
  #   * behind Tailscale: set 0.0.0.0 (the tailnet is your firewall), or
  #   * bind your tailscale IP directly.
  # NEVER bind 0.0.0.0 while also forwarding a public port — see DEPLOY.md.
  bind_host: 127.0.0.1
  port: 8700
  # Requests per minute per client IP before 429s. Assume adversarial input.
  rate_limit_per_min: 120

# Node topology. DEFAULT: Mini-only — the hub runs all inference locally.
nodes:
  hub_ollama:
    ollama_url: http://127.0.0.1:11434   # Ollama on the Mini itself
    role: embeddings_and_fallback
    check_interval_s: 60
  # --- OPTIONAL second machine ---------------------------------------
  # Uncomment and set the URL to add a MacBook (or any box) with bigger
  # models. Leave it commented for a pure Mini-only setup — the router
  # simply won't try it, so chat never waits on a sleeping laptop.
  # macbook:
  #   ollama_url: http://shaiks-macbook-pro:11434
  #   role: primary_inference
  #   check_interval_s: 30

bus:
  poll_interval_s: 1.0     # consumer poll cadence; 1s keeps CPU/RAM negligible
  max_attempts: 5          # per-consumer retries before a message is dead-lettered
  retention_days: 14       # processed messages pruned after this

health:
  # How many node-status history rows to keep per node.
  history_rows_per_node: 500

logging:
  level: INFO
  # JSON to stderr by default (journald-friendly). Set pretty: true for dev.
  pretty: false

cognition:
  # The agent tool-loop lets you say "remind me at 6pm…", "what are my
  # tasks?", "search the web for…", etc. — but it makes SEVERAL model calls
  # per message. On fast cloud tiers keep it on; on a slow local-only Mini
  # set false for single-call chat (tools then only via dashboard/CLI).
  use_tools: true
  # How many recent turns of a conversation to feed back as context.
  history_turns: 12
  # Extra persona/style instruction appended to the base prompt. Empty keeps
  # the concise butler; set e.g. "Give thorough, detailed answers with
  # examples." for a more ChatGPT-like verbose assistant.
  extra_system_prompt: ""

tools:
  # file_read / file_list may only touch paths under these roots.
  files_allowed_roots: ["~/notes", "~/projects"]
  # Calendar: ICS URLs (Google Calendar 'secret address in iCal format',
  # Fastmail, etc.) or local .ics file paths.
  calendar_ics_urls: []
  # Home-lab nodes for allow-listed commands over ssh: name -> user@host.
  # Requires key-based ssh already set up from the hub.
  homelab: {}
  #   mini: jarvis@100.64.0.1
