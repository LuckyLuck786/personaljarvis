[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — a private, self-hosted, always-on personal AI assistant"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",          # plain (no [standard]) — h11 worker is leaner on RAM
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    # NOTE: no LanceDB/pyarrow — vectors live in SQLite as float32 blobs with a
    # pure-Python cosine search. Those native libs require AVX and SIGILL on
    # pre-2011 CPUs (e.g. the 2010 Mac Mini), and are heavy on a 6 GB hub.
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Voice extras run on the MacBook (mic + models); the hub needs none of these.
voice = [
    "faster-whisper>=1.0",     # STT
    "openwakeword>=0.6",       # wake word "Jarvis"
    "sounddevice>=0.4",        # mic capture
    "numpy>=1.26",
    # Piper (TTS) is a standalone binary — install separately, see README.
]

[project.scripts]
jarvis = "jarvis.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
