[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — a private, self-hosted, always-on personal AI assistant"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",          # plain (no [standard]) — h11 worker is leaner on RAM
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "lancedb>=0.15",              # on-disk vector store; no server process (6 GB hub)
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis = "jarvis.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
